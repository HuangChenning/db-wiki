<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <title>db-wiki - Multiverse Database Documentation Knowledge Base</title>
  <desc>Offline-ready Markdown reading library for Oracle, MySQL, Dameng, HighGo, and OceanBase official documentation.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="1200" height="480" rx="16" fill="url(#grid)" />

  <!-- Left Content Column -->
  <!-- Category Pill -->
  <g transform="translate(64, 56)">
    <rect width="250" height="30" rx="15" fill="#1f293d" stroke="#388bfd" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#388bfd" />
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#79c0ff" letter-spacing="1">DATABASE WIKI ARCHIVE</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(64, 134)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#f0f6fc" letter-spacing="-1">db-wiki</text>
    <text x="190" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#58a6ff">v2026.11</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(64, 176)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e" line-height="28">
      <tspan x="0" y="0">多引擎数据库官方文档 Markdown 离线知识库</tspan>
      <tspan x="0" y="28" font-size="16" fill="#6e7681">按版本和手册精细化编目 · 保留官方源溯源 · 亚毫秒级全库即时检索</tspan>
    </text>
  </g>

  <!-- Key Metrics / Highlights -->
  <g transform="translate(64, 252)">
    <!-- Metric 1: Engines -->
    <g transform="translate(0, 0)">
      <rect width="132" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f6fc">5 大</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8b949e">主流数据引擎</text>
    </g>

    <!-- Metric 2: Versions -->
    <g transform="translate(144, 0)">
      <rect width="132" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#58a6ff">21 个</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8b949e">细分历史版本</text>
    </g>

    <!-- Metric 3: Chapters -->
    <g transform="translate(288, 0)">
      <rect width="144" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3fb950">40,000+</text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8b949e">全结构化章节</text>
    </g>
  </g>

  <!-- Tag Badges -->
  <g transform="translate(64, 350)">
    <!-- Oracle -->
    <rect x="0" y="0" width="86" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="43" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Oracle</text>

    <!-- MySQL -->
    <rect x="94" y="0" width="84" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="136" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">MySQL</text>

    <!-- Dameng -->
    <rect x="186" y="0" width="84" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="228" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">达梦 DM</text>

    <!-- HighGo -->
    <rect x="278" y="0" width="84" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="320" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">瀚高 DB</text>

    <!-- OceanBase -->
    <rect x="370" y="0" width="102" height="28" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="421" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#58a6ff">OceanBase</text>
  </g>

  <!-- Right Column: Interactive Terminal Preview -->
  <g transform="translate(560, 56)">
    <!-- Terminal Container -->
    <rect width="576" height="364" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />

    <!-- Terminal Window Controls -->
    <rect width="576" height="38" rx="10" fill="#21262d" />
    <!-- Fix bottom corners of header -->
    <rect y="28" width="576" height="10" fill="#21262d" />
    <circle cx="20" cy="19" r="6" fill="#f85149" />
    <circle cx="38" cy="19" r="6" fill="#d29922" />
    <circle cx="56" cy="19" r="6" fill="#3fb950" />
    <text x="82" y="24" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">bash · db-wiki ~ ripgrep retrieval</text>

    <!-- Terminal Body -->
    <g transform="translate(24, 62)">
      <!-- Command Prompt Line -->
      <text x="0" y="16" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#3fb950" font-weight="600">$</text>
      <text x="18" y="16" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#e6edf3">rg -n -g '*.md' 'MVCC' OceanBase/ Oracle/</text>

      <!-- Search Output Result 1: Oracle -->
      <g transform="translate(0, 42)">
        <rect width="528" height="64" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
        <text x="12" y="22" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#58a6ff" font-weight="600">Oracle/Oracle19c/concepts/data-concurrency-and-consistency.md:42</text>
        <text x="12" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">Oracle Database provides multiversion consistency through undo segments...</text>
      </g>

      <!-- Search Output Result 2: OceanBase -->
      <g transform="translate(0, 116)">
        <rect width="528" height="64" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
        <text x="12" y="22" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#58a6ff" font-weight="600">OceanBase/OceanBase-v5.0.1/concepts/transaction-engine.md:18</text>
        <text x="12" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">OceanBase 基于全局时间戳与 LSM-Tree 存储引擎实现分布式 MVCC 读写隔离...</text>
      </g>

      <!-- Search Output Result 3: Best Practice -->
      <g transform="translate(0, 190)">
        <rect width="528" height="64" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
        <text x="12" y="22" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#58a6ff" font-weight="600">OceanBase/best-practices/develop/1000-hot-table.md:31</text>
        <text x="12" y="44" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">在高并发热点行场景下，建议通过批处理与提前锁释放规避长时间行级阻塞...</text>
      </g>

      <!-- Status Footer Bar -->
      <g transform="translate(0, 266)">
        <rect width="528" height="24" rx="4" fill="#1f2937" />
        <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
        <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#7ee787">3 matches in 0.008s · 100% offline-ready</text>
      </g>
    </g>
  </g>
</svg>
